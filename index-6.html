function useSpeaker(soundOn) {
    const voicesRef = useRef([]);
    const [hasArabicVoice, setHasArabicVoice] = useState(true); // متفائل حتى يثبت العكس
    const [checked, setChecked] = useState(false);
    useEffect(() => {
        function loadVoices() {
            const list = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            if (list && list.length) {
                voicesRef.current = list;
                setHasArabicVoice(list.some((v) => v.lang && v.lang.toLowerCase().startsWith("ar")));
                setChecked(true);
            }
        }
        loadVoices();
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            setTimeout(loadVoices, 700);
            // تهيئة محرك الصوت مبكرًا: بعض المتصفحات على أندرويد تفشل بصمت
            // في أول استدعاء لـ speak() قبل أن يكون المحرك جاهزًا فعليًا
            try {
                const warmup = new SpeechSynthesisUtterance(" ");
                warmup.volume = 0;
                window.speechSynthesis.speak(warmup);
            }
            catch (e) {
                // تجاهل أي خطأ في التهيئة المسبقة
            }
        }
    }, []);
    const speak = useCallback((text) => {
        if (!soundOn)
            return;
        try {
            if (!window.speechSynthesis)
                return;
            window.speechSynthesis.cancel();
            // تأخير بسيط بعد الإلغاء: بعض محركات النطق على أندرويد
            // تحتاج لحظة قبل قبول أمر نطق جديد، وإلا يُقطع الصوت في منتصفه
            setTimeout(() => {
                const utter = new SpeechSynthesisUtterance(text);
                const arabicVoice = voicesRef.current.find((v) => v.lang && v.lang.toLowerCase().startsWith("ar"));
                if (arabicVoice)
                    utter.voice = arabicVoice;
                utter.lang = arabicVoice ? arabicVoice.lang : "ar-SA";
                utter.rate = 0.8;
                utter.pitch = 1.1;
                window.speechSynthesis.speak(utter);
            }, 80);
        }

            console.log("تعذّر تشغيل الصوت في هذا المتصفح");
        }

}
